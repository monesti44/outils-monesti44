name: Mise à jour DVF complète

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 3 * *"   # le 3 de chaque mois à 6h17 (heure de Paris)

permissions:
  contents: write
  pages: write

jobs:
  dvf:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Télécharger et préparer toutes les ventes DVF du 44
        run: python scripts/dvf_complet.py
      - name: Publier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "Mise à jour DVF"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dvf
          if git diff --cached --quiet; then echo "Rien de nouveau."; exit 0; fi
          git commit -m "DVF : mise à jour du $(date +%d/%m/%Y)"
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
